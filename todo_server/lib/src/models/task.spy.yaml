class: Task
table: task
fields:
  id: UuidValue?, defaultPersist=random_v7
  userId: int
  customerId: UuidValue, relation(parent=customer, onDelete=Cascade)
  createdAt: DateTime
  lastModified: DateTime
  isDeleted: bool, default=false
  title: String
  description: String?
  points: int, default=0
  coefficient: int, default=1
  startValue: int, default=0
  endValue: int, default=0
  fixValue: int, default=0
  startDate: DateTime
  endDate: DateTime?
  dueDate: DateTime?
  completePercentage: int, default=0
  
  isDone: bool, default=false
  categoryId: UuidValue?, relation(parent=category, onDelete=SetNull)
  category: Category?, scope=serverOnly
  taskTagMaps: List<TaskTagMap>?, relation

