services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: todo
      POSTGRES_PASSWORD: "B204QHnM_Lrsjkp5MwdKjGkWdnYaUIVR"
    volumes:
      - todo_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "1ifT69T5uMtRkaExOuIpdbWcL8hVpIh-"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: todo_test
      POSTGRES_PASSWORD: "_3uzZVDiF2O61Al_QXS5WHNiyPS0450b"
    volumes:
      - todo_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "qlavqKuyw3_mCPR6ZGAO44aoDTsp-9DI"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  todo_data:
  todo_test_data:
